<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Cynosure: Jev-based decision architecture</title>
  <desc id="desc">A task and retrieved experience inform Jev's structured action selection. A budget-constrained scheduler invokes model candidates through the Router. Complete answers or selected tool proposals go to the application or Pi host. Actual feedback and call traces enter SQLite, and vector plus full-text retrieval brings relevant experience into future decisions. The three planes are logical responsibilities within one runtime.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1225"/><stop offset="1" stop-color="#101b32"/></linearGradient>
    <linearGradient id="policy" x2="1" y2="1"><stop stop-color="#133a54"/><stop offset="1" stop-color="#162849"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#91a4c6" stroke-opacity=".035"/></pattern>
    <marker id="cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#63d6ed" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#63dfb8" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <marker id="violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#b8a2ff" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .heading { fill: #f4f7ff; font-size: 21px; font-weight: 650; }
      .detail { fill: #b0bfd6; font-size: 16px; }
      .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: 2px; }
      .card { fill: #152239; stroke: #334662; stroke-width: 1.2; }
      .flow { fill: none; stroke: #63d6ed; stroke-width: 2; marker-end: url(#cyan); }
      .feedback { fill: none; stroke: #63dfb8; stroke-width: 2; marker-end: url(#green); }
      .memory { fill: none; stroke: #b8a2ff; stroke-width: 2; marker-end: url(#violet); }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="958" rx="24" fill="url(#bg)" stroke="#2a3a55"/>
  <rect x="1" y="1" width="1198" height="958" rx="24" fill="url(#grid)"/>
  <g transform="translate(48 40)">
    <path d="m16 0 4 12 12 4-12 4-4 12-4-12L0 16l12-4Z" fill="#63d6ed"/>
    <text x="46" y="27" fill="#f4f7ff" font-size="32" font-weight="750" letter-spacing="-.6">Cynosure</text>
    <text x="1104" y="24" fill="#9daec9" font-size="15" text-anchor="end">MobAI Inc.</text>
  </g>
  <text x="48" y="99" fill="#b7c8e0" font-size="20">Jev-Based Decision Architecture</text>
  <text x="1152" y="99" fill="#7990b0" font-size="13" text-anchor="end">NATIVE CHOICE · ADAPTIVE MODEL ORCHESTRATION</text>

  <rect x="48" y="126" width="1104" height="68" rx="14" fill="#17273e" stroke="#3b526f"/>
  <circle cx="80" cy="160" r="6" fill="#63d6ed"/>
  <text x="102" y="167" class="heading">Task + Context</text>
  <text x="348" y="167" class="detail">Goal · Project Scope · Execution Budget</text>
  <rect x="862" y="144" width="268" height="32" rx="16" fill="#24354e"/>
  <text x="996" y="165" fill="#d3dff0" font-size="14" text-anchor="middle">LLM Application / CLI / Pi Host</text>

  <rect x="48" y="226" width="1104" height="194" rx="18" fill="#101f34" stroke="#28445e"/>
  <text x="80" y="254" class="eyebrow" fill="#63d6ed">JEV DECISION PLANE</text>
  <text x="1120" y="254" class="eyebrow" fill="#6587a6" text-anchor="end">01</text>
  <rect x="80" y="278" width="304" height="100" rx="12" class="card"/>
  <text x="100" y="310" class="heading">Hybrid Retrieval</text>
  <text x="100" y="337" class="detail">Vector Search + FTS5</text>
  <text x="100" y="360" class="detail">Reciprocal Rank Fusion · RRF</text>
  <rect x="448" y="278" width="304" height="100" rx="12" fill="url(#policy)" stroke="#58bdd7" stroke-width="1.5"/>
  <text x="468" y="310" class="heading">Jev Decision Core</text>
  <text x="468" y="337" class="detail">Native Choice · Action Selection</text>
  <text x="468" y="360" class="detail">Candidate + Outcome Evidence</text>
  <rect x="816" y="278" width="304" height="100" rx="12" class="card"/>
  <text x="836" y="310" class="heading">Bounded Scheduling</text>
  <text x="836" y="337" class="detail">Atomic Budget Reservation</text>
  <text x="836" y="360" class="detail">Concurrency Limits · Fallback</text>
  <path d="M600 194V270" class="flow"/>
  <path d="M384 328H440" class="flow"/>
  <path d="M752 328H808" class="flow"/>

  <rect x="48" y="450" width="1104" height="194" rx="18" fill="#10262d" stroke="#28534f"/>
  <text x="80" y="478" class="eyebrow" fill="#63dfb8">EXECUTION PLANE</text>
  <text x="1120" y="478" class="eyebrow" fill="#598e84" text-anchor="end">02</text>
  <rect x="80" y="502" width="304" height="100" rx="12" class="card"/>
  <text x="100" y="534" class="heading">Application / Pi Host</text>
  <text x="100" y="561" class="detail">Read · Edit · Execute Tools</text>
  <text x="100" y="584" class="detail">User + Test Observations</text>
  <rect x="448" y="502" width="304" height="100" rx="12" class="card"/>
  <text x="468" y="534" class="heading">Selected Delivery</text>
  <text x="468" y="561" class="detail">Complete Answer / Tool Proposal</text>
  <text x="468" y="584" class="detail">One Selected Branch to Host</text>
  <rect x="816" y="502" width="304" height="100" rx="12" class="card"/>
  <text x="836" y="534" class="heading">Multi-Model Execution</text>
  <text x="836" y="561" class="detail">Router Provider Adapters</text>
  <text x="836" y="584" class="detail">Single Candidate / Bounded Fan-Out</text>
  <path d="M968 378V494" class="flow"/>
  <path d="M816 552H760" class="feedback"/>
  <path d="M448 552H392" class="feedback"/>
  <path d="M900 502V438H600V386" class="flow" stroke-dasharray="5 5"/>
  <rect x="485" y="428" width="230" height="22" rx="11" fill="#0f1d30"/>
  <text x="600" y="443" fill="#8bcddb" font-size="12" text-anchor="middle">Candidate evidence → next decision</text>

  <rect x="48" y="674" width="1104" height="194" rx="18" fill="#201d37" stroke="#4a3f68"/>
  <text x="80" y="702" class="eyebrow" fill="#b8a2ff">EXPERIENCE PLANE</text>
  <text x="1120" y="702" class="eyebrow" fill="#8b79b2" text-anchor="end">03</text>
  <rect x="80" y="726" width="304" height="100" rx="12" class="card"/>
  <text x="100" y="758" class="heading">Feedback Ingestion</text>
  <text x="100" y="785" class="detail">Tool Results · Regression Checks</text>
  <text x="100" y="808" class="detail">User Corrections · Provenance</text>
  <rect x="448" y="726" width="304" height="100" rx="12" class="card"/>
  <text x="468" y="758" class="heading">Trace + Cost Ledger</text>
  <text x="468" y="785" class="detail">Tasks · Decisions · Calls · Feedback</text>
  <text x="468" y="808" class="detail">SQLite Transactional Persistence</text>
  <rect x="816" y="726" width="304" height="100" rx="12" class="card"/>
  <text x="836" y="758" class="heading">Experience Index</text>
  <text x="836" y="785" class="detail">sqlite-vec · FTS5 · Embedding Cache</text>
  <text x="836" y="808" class="detail">Scope + Time + Embedding Revision</text>
  <path d="M320 602V710H232V718" class="feedback"/>
  <path d="M384 776H440" class="memory"/>
  <path d="M752 776H808" class="memory"/>
  <path d="M968 826V890H24V328H72" class="memory" stroke-dasharray="6 6"/>
  <text x="80" y="851" fill="#a296bc" font-size="13">Recorded outcomes become retrievable evidence for subsequent routing decisions.</text>

  <text x="48" y="927" fill="#c1cee1" font-size="14">Jev decides. Code orchestrates. Experience informs.</text>
  <text x="1152" y="927" fill="#91a2bd" font-size="14" text-anchor="end">No router-model training required.</text>
</svg>
